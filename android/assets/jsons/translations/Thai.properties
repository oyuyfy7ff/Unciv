 # Requires translation!
Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = อัตติลาผู้ยิ่งใหญ่ นักรบผู้ทรงพลังและผู้นำจักรวรรดิฮัน คนของท่านก้มกราบต่อท่าน ในศตวรรษที่ 5 ท่านและพี่ชายเบลดาพิชิตดินแดนมากมาย สร้างจักรวรรดิอันทรงพลัง และบัญชากองกำลังที่ทรงพลังและน่าสะพรึงกลัวที่สุดในยุคโบราณ ท่านทำให้จักรพรรดิโรมันเองเกรงกลัว ผู้เรียกท่านว่า 'ฟลาเจลลุม เดอี' หรือ 'ภัยพิบัติแห่งพระเจ้า' เมื่อท่านยึดอาณาจักรแล้วอาณาจักรเล่าในบอลข่าน รุกรานจักรวรรดิโรมันตะวันออก เข้าสู่กอลและอิตาลีตอนเหนือ และวางแผนพิชิตโรมเอง จักรวรรดิของท่านไม่อยู่รอดนานหลังท่านสิ้น แต่ชื่อและตำนานของท่านคงอยู่ไปอีกนานนับพันปี
