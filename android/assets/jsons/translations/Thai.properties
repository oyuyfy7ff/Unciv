I have failed. May you, at least, know compassion towards our people. = ข้าล้มเหลวแล้ว ขอให้เจ้ามีความเมตตาต่อประชาชนของเราอย่างน้อยก็ตาม
Cape Town = Cape Town

 # Requires translation!
How barbaric. Those who live by the sword shall perish by the sword. = ช่างป่าเถื่อน ผู้ที่อยู่ด้วยดาบจะตายด้วยดาบ
Genoa = Genoa

 # Requires translation!
The day of judgement has come to us. But rest assured, the same will go for you! = วันพิพากษามาถึงเราแล้ว แต่จงมั่นใจว่าเจ้าก็จะเป็นเช่นเดียวกัน!
Helsinki = Helsinki

 # Requires translation!
Ah, Gods! Why have you forsaken us? = อา เทพเจ้า! เหตุใดพวกท่านจึงทอดทิ้งเรา?
Manila = Manila

 # Requires translation!
Congratulations, conqueror. This tribe serves you now. = ขอแสดงความยินดี ผู้พิชิต บัดนี้เผ่านี้รับใช้เจ้า
Mogadishu = Mogadishu

 # Requires translation!
We were too weak to protect ourselves... = เราอ่อนแอเกินกว่าจะปกป้องตัวเอง...
Quebec City = Quebec City

Ragusa = Ragusa

 # Requires translation!
I have to do this, for the sake of progress if nothing else. You must be opposed! = ข้าต้องทำเช่นนี้ เพื่อความก้าวหน้าถ้าไม่มีเหตุผลอื่น เจ้าต้องถูกต่อต้าน!
 # Requires translation!
You can see how fruitless this will be for you... right? = เจ้าเห็นแล้วว่าสิ่งนี้จะไร้ผลสำหรับเจ้า... ใช่ไหม?
 # Requires translation!
May God grant me these last wishes - peace and prosperity for Brazil. = ขอพระเจ้าทรงประทานพรสุดท้ายแก่ข้า คือสันติและความเจริญรุ่งเรืองแก่บราซิล
Rio de Janeiro = Rio de Janeiro

 # Requires translation!
Perhaps, in another world, we could have been friends... = บางที ในอีกโลกหนึ่ง เราอาจเป็นเพื่อนกันได้...
Singapore = Singapore

 # Requires translation!
After thorough deliberation, Australia finds itself at a crossroads. Prepare yourself, for war is upon us. = หลังพิจารณาอย่างถี่ถ้วน ออสเตรเลียพบว่าตนอยู่ที่ทางแยก จงเตรียมตัว เพราะสงครามมาถึงเราแล้ว
 # Requires translation!
We will mobilize every means of resistance to stop this transgression against our nation! = เราจะระดมทุกวิถีทางเพื่อต่อต้านเพื่อหยุดการล่วงละเมิดต่อชาติของเรา!
 # Requires translation!
The principles for which we have fought will survive longer than any nation you could ever build. = หลักการที่เราต่อสู้เพื่อมันจะยืนยาวกว่าชาติใดที่เจ้าจะสร้างได้
Sydney = Sydney

 # Requires translation!
I will enjoy hearing your last breath as you witness the destruction of your realm! = ข้าจะเพลิดเพลินกับการฟังลมหายใจสุดท้ายของเจ้า ขณะที่เจ้าเห็นอาณาจักรของเจ้าถูกทำลาย!
 # Requires translation!
Why do we fight? Because Inanna demands it. Now, witness the power of the Sumerians! = เหตุใดเราจึงสู้? เพราะอินันนาต้องการเช่นนั้น บัดนี้จงประจักษ์ในพลังของชาวสุเมเรียน!
 # Requires translation!
What treachery has struck us? No, what evil? = การทรยศอะไรที่มาโจมตีเรา? ไม่ มันคือความชั่วร้ายอะไรกัน?
Ur = Ur

 # Requires translation!
In responding to the unstinting malignancy that has heretofore defined your relationship with Canada, we can have no recourse but war! = เพื่อตอบสนองต่อความประสงค์ร้ายอย่างไม่หยุดยั้งที่เป็นตัวกำหนดความสัมพันธ์ของเจ้ากับแคนาดามาจนบัดนี้ เราไม่มีทางเลือกอื่นนอกจากสงคราม!
 # Requires translation!
As we can reach no peaceful resolution with you, Canada must turn, with reluctance, to war. = เมื่อเราไม่อาจหาข้อยุติโดยสันติกับเจ้าได้ แคนาดาจึงจำใจหันสู่สงคราม
 # Requires translation!
I regret not defending my country to the last, although it was not of use. = ข้าเสียใจที่ไม่ได้ปกป้องประเทศจนถึงที่สุด แม้จะไม่เกิดประโยชน์ก็ตาม
Vancouver = Vancouver

 # Requires translation!
You have revealed your purposes a bit too early, my friend... = เจ้าเผยเจตนาของเจ้าเร็วเกินไปหน่อย สหายของข้า...
 # Requires translation!
A wrong calculation, on my part. = การคำนวณที่ผิดพลาดของข้าเอง
Venice = Venice

 # Requires translation!
They will write songs of this.... pray that they shall be in your favor. = พวกเขาจะแต่งเพลงเกี่ยวกับเรื่องนี้... ภาวนาให้มันเป็นไปในทางที่เป็นคุณกับเจ้า
Antwerp = Antwerp

 # Requires translation!
May the Heavens forgive you for inflicting this humiliation to our people. = ขอให้สวรรค์ให้อภัยเจ้าที่ทำให้ประชาชนของเราอับอาย
Zanzibar = Zanzibar

 # Requires translation!
How could we fall to the likes of you?! = เราพ่ายแพ้ให้คนอย่างเจ้าได้อย่างไร?!
Almaty = Almaty

 # Requires translation!
Let's have a nice little War, shall we? = มาทำสงครามเล็ก ๆ ดี ๆ กันเถอะ ดีไหม?
 # Requires translation!
If you need your nose bloodied, we'll happily serve. = หากเจ้าต้องการให้จมูกเลือดออก เรายินดีบริการ
 # Requires translation!
The serbian guerilla will never stop haunting you! = กองโจรเซอร์เบียจะหลอกหลอนเจ้าไม่หยุด!
Belgrade = Belgrade

Budapest = Budapest

 # Requires translation!
War lingers in our hearts. Why carry on with a false peace? = สงครามยังคงอยู่ในใจเรา ทำไมต้องฝืนสันติสุขเก๊?
 # Requires translation!
You gormless radger! You'll dine on your own teeth before you set foot in Ireland! = เจ้าคนโง่งี่เง่า! เจ้าจะต้องกินฟันตัวเองก่อนจะได้ก้าวเท้าเข้าไอร์แลนด์!
 # Requires translation!
A lonely wind blows through the highlands today. A dirge for Ireland. Can you hear it? = ลมเปล่าเปลี่ยวพัดผ่านที่ราบสูงวันนี้ บทเพลงไว้อาลัยแด่ไอร์แลนด์ เจ้าได้ยินไหม?
Dublin = Dublin

 # Requires translation!
You shall stain this land no longer with your vileness! To arms, my countrymen - we ride to war! = เจ้าจะไม่เปื้อนแผ่นดินนี้ด้วยความชั่วช้าของเจ้าอีกต่อไป! จับอาวุธ ชาวชาติข้า เราควบม้าไปสงคราม!
 # Requires translation!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your head! = ผู้ทรยศ! ชาวเคลต์จะไม่ทนต่อการข่มเหงและใส่ร้ายโดยไร้เหตุผลเช่นนี้ ข้าจะเอาหัวเจ้า!
 # Requires translation!
Vile ruler, know that you 'won' this war in name only! = ผู้ปกครองชั่วช้า จงรู้ไว้ว่าเจ้า 'ชนะ' สงครามนี้เพียงในนามเท่านั้น!
Edinburgh = Edinburgh

 # Requires translation!
So this is how it feels to die... = ที่แท้การตายรู้สึกเช่นนี้เอง...
Hanoi = Hanoi

 # Requires translation!
Do you really think you can walk over us so easily? I will not let it happen. Not to Kongo - not to my people! = เจ้าคิดจริง ๆ หรือว่าจะเหยียบย่ำเราได้ง่ายขนาดนั้น? ข้าจะไม่ปล่อยให้เกิดขึ้น ไม่ใช่กับคองโก ไม่ใช่กับประชาชนของข้า!
 # Requires translation!
We are no strangers to war. You have strayed from the right path, and now we will correct it. = เราไม่แปลกหน้ากับสงคราม เจ้าหลงทางออกจากเส้นทางที่ถูกต้อง และบัดนี้เราจะแก้ไขมัน
 # Requires translation!
You are nothing but a glorified barbarian. Cruel, and ruthless. = เจ้าเป็นเพียงคนป่าเถื่อนที่ถูกยกย่อง โหดร้ายและไร้ความปรานี
M'Banza-Kongo = M'Banza-Kongo

 # Requires translation!
What a fine battle! Sidon is willing to serve you! = ช่างเป็นการรบที่ยอดเยี่ยม! ไซดอนยินดีรับใช้เจ้า!
Sidon = Sidon

 # Requires translation!
We never fully trusted you from the start. = เราไม่เคยไว้ใจเจ้าเต็มที่ตั้งแต่แรก
Tyre = Tyre

 # Requires translation!
We don't like your face. To arms! = เราไม่ชอบหน้าเจ้า จับอาวุธ!
 # Requires translation!
You will see you have just bitten off more than you can chew. = เจ้าจะเห็นว่าเจ้าเพิ่งกัดสิ่งที่เกินกำลังเคี้ยว
 # Requires translation!
This ship may sink, but our spirits will linger. = เรือลำนี้อาจจม แต่จิตวิญญาณของเราจะคงอยู่
Valletta = Valletta


