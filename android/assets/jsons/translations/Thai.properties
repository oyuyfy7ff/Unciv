 # Requires translation!
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = สมเด็จพระราชินีมาเรีย เทเรซาผู้สูงศักดิ์และศรัทธา จักรพรรดินีแห่งจักรวรรดิโรมันอันศักดิ์สิทธิ์และผู้ปกครองออสเตรีย ประชาชนเคารพพระกรุณาของพระองค์ หลังพระเจ้าชาร์ลที่ 6 พระราชบิดาสวรรคต พระองค์ทรงสืบบัลลังก์ออสเตรียในช่วงเวลาที่เศรษฐกิจและการทหารยากลำบาก แต่พระองค์ใช้ปัญญาและความมุ่งมั่นที่ไม่ย่อท้อขับไล่ศัตรูและแก้ปัญหาอุปสรรคต่อเสถียรภาพและความเจริญรุ่งเรือง โดยมีพระสวามีฟรานซิส สตีเฟนเป็นผู้ปกครองร่วม พระองค์ทรงรับรองตำแหน่งของพระองค์ในฐานะจักรพรรดินีแห่งจักรวรรดิโรมันอันศักดิ์สิทธิ์ ในรัชสมัยของพระองค์ ทรงปฏิรูปออสเตรียหลายด้าน มอบกองทัพที่ทรงพลัง แบบจำลองเศรษฐกิจที่มั่นคง และระบบการศึกษาที่ดีขึ้น
