#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own!

 # Requires translation!
Welcome to Unciv! = ยินดีต้อนรับสู่ Unciv!
 # Requires translation!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = เพราะเกมนี้ซับซ้อน จึงมีบทสอนช่วยให้คุณคุ้นเคย บทสอนเหล่านี้ปิดได้ที่ตัวเลือก -> การแสดงผล แต่ถ้าคุณเป็นมือใหม่ โปรดอดทนไว้ก่อน!
 # Requires translation!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = ภารกิจแรกของคุณคือก่อตั้งเมืองหลวง งานนี้สำคัญมาก เพราะเมืองหลวงของคุณมักจะเจริญที่สุด โบนัสในเกมหลายอย่างใช้ได้เฉพาะเมืองหลวง และมันจะเป็นศูนย์กลางของจักรวรรดิของคุณ
 # Requires translation!
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = คุณรู้ได้อย่างไรว่าที่ตั้งเมืองเหมาะสม? โชคดีที่เกมเลือกที่ตั้งที่ดีไว้ให้แล้ว คุณตั้งถิ่นฐานที่นี่ได้ หรืออาจเดินไปอีกหนึ่งเทิร์นเพื่อสร้างบนเนินเขา (เพื่อการผลิตและการป้องกัน) หรือติดภูเขา (เพื่อสร้างหอดูดาวในภายหลัง)
 # Requires translation!
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = คุณคงอยากได้เมืองเพิ่มในภายหลัง สำหรับเมืองเหล่านี้ คุณต้องออกไปหาที่ตั้งที่ดี หลักง่าย ๆ คือมองหาและสร้างเมืองบนหรือใกล้ทรัพยากรฟุ่มเฟือย
 # Requires translation!
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = ทรัพยากรฟุ่มเฟือยคือช่องที่มีสิ่งของอย่างอัญมณี ฝ้าย หรือไหม (แสดงด้วยพื้นหลังสีเหลืองของไอคอนทรัพยากร) ทรัพยากรเหล่านี้ทำให้อารยธรรมของคุณมีความสุข คุณควรมองหาทรัพยากรที่ใช้สร้างยูนิตด้วย เช่น เหล็ก เมืองสร้างภายในระยะ 3 ช่องจากเมืองที่มีอยู่ไม่ได้ ซึ่งเป็นอีกเรื่องที่ควรจำไว้!
 # Requires translation!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = เมืองจะมีประชากรอาศัย ซึ่งทำงานบนช่องที่ห่างจากเมืองได้ถึง 3 ช่อง นั่นหมายความว่าคุณไม่ต้องตั้งเมืองบนหรือติดช่องที่ดีเสมอไป สมมติว่าคุณอยากได้เหล็ก แต่ทรัพยากรอยู่ในพื้นที่ทะเลทราย คุณไม่จำเป็นต้องตั้งเมืองในทะเลทราย คุณตั้งห่างออกไปสองสามช่องในดินแดนที่อุดมสมบูรณ์กว่าได้ เมืองจะเติบโตและเข้าถึงทรัพยากรนั้นในที่สุด คุณต้องตั้งบนทรัพยากรโดยตรงเฉพาะเมื่อต้องการมันทันที
 # Requires translation!
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = สิ่งแรกที่ออกจากเมืองของคุณขึ้นอยู่กับกลยุทธ์ที่ต้องการ แต่ลำดับสร้างแบบ 'คลาสสิก' คือสร้างทหารสอดแนมสองยูนิตก่อน แล้วศาลเจ้า และผู้ตั้งถิ่นฐานสามยูนิต และรับประเพณี เพื่อสำรวจแผนที่อย่างรวดเร็ว (ทหารสอดแนมไม่คิดต้นทุนภูมิประเทศ) และได้เทพเจ้าประจำถิ่นตั้งแต่เนิ่น ๆ (หากคุณเล่นโดยเปิดใช้ศาสนา)
 # Requires translation!
But feel free to experiment with your own build orders! = แต่อย่าลังเลที่จะทดลองลำดับสร้างของคุณเอง!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention.

 # Requires translation!
Culture and Policies = วัฒนธรรมและนโยบาย
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely!

 # Requires translation!
City Expansion = การขยายเมือง
 # Requires translation!
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = เมื่อเมืองสะสมวัฒนธรรมได้มากพอ เมืองจะขยายไปยังช่องข้างเคียง\nคุณควบคุมช่องที่เมืองจะขยายไปไม่ได้ แต่ช่องที่มีทรัพยากรและผลผลิตสูงกว่าจะได้รับความสำคัญก่อน
 # Requires translation!
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = ช่องที่เพิ่มขึ้นแต่ละช่องต้องใช้วัฒนธรรมมากขึ้น แต่โดยทั่วไปเมืองแรก ๆ ของคุณจะขยายออกไปครอบคลุมช่วงช่องกว้างในที่สุด
 # Requires translation!
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = แม้เมืองจะขยายไปเรื่อย ๆ ตลอดไป แต่ประชากรของคุณทำงานได้ห่างจากศูนย์กลางเมืองเพียง 3 ช่อง\nควรคำนึงเรื่องนี้เมื่อวางเมืองใหม่

 # Requires translation!
Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = อาหารเป็นทรัพยากรพื้นฐานของประชากรและสุขภาพของเมือง และของชาติโดยรวม
 # Requires translation!
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = ประชากรทุกคนในแต่ละเมืองบริโภคอาหารต่อเทิร์น ส่วนที่เหลือถือเป็นการเติบโตและเก็บไว้ที่ศูนย์กลางเมือง เมื่อสะสมพอ เมืองจะเติบโตและเพิ่มประชากรใหม่
 # Requires translation!
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = ในตอนแรกแหล่งอาหารหลักของคุณคือศูนย์กลางเมืองเองและการให้ประชากรทำงานบนช่องรอบ ๆ คุณเพิ่มปริมาณที่ผลิตได้โดยมีประชากรมากขึ้นเพื่อทำงานบนช่องมากขึ้น ปรับปรุงช่องเพื่อให้ได้อาหารมากขึ้น และในที่สุดด้วยสิ่งก่อสร้างและนโยบาย
 # Requires translation!
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = เนื่องจากจำนวนประชากรของเมืองกำหนดว่าเมืองทำงานบนช่องได้กี่ช่อง อาหารจึงมักเป็นทรัพยากรที่สำคัญที่สุด

 # Requires translation!
Production is the resource that lets a City Center build new things. = การผลิตคือทรัพยากรที่ให้ศูนย์กลางเมืองสร้างสิ่งใหม่ ๆ
 # Requires translation!
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = อาจเป็นสิ่งก่อสร้างใหม่ที่เพิ่มเข้าศูนย์กลางเมือง หรือยูนิตใหม่ที่ออกไปบนแผนที่โลกเพื่อเดินหน้าเป้าหมายของชาติ
 # Requires translation!
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = ทุกสิ่งที่คุณสร้างได้มีต้นทุนการผลิต ทุกเทิร์นแต่ละเมืองสร้างการผลิตจำนวนหนึ่งและใส่ลงในสิ่งที่อยู่บนสุดของคิวก่อสร้าง เมื่อสะสมครบต้นทุน สิ่งก่อสร้างหรือยูนิตก็ถูกสร้าง!
 # Requires translation!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = การผลิตส่วนเกินหลังสร้างเสร็จจะล้นไปยังสิ่งถัดไปที่เมืองสร้าง ไม่เกินต้นทุนการผลิตทั้งหมดของมัน
 # Requires translation!
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = เนื่องจากสิ่งนี้กำหนดว่าคุณสร้างสิ่งต่าง ๆ ได้เร็วเพียงใด กำลังการผลิตของชาติจึงสำคัญต่อความก้าวหน้าและการอยู่รอด

 # Requires translation!
⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾วิทยาศาสตร์คือทรัพยากรที่ปลดล็อกเทคโนโลยีใหม่ที่น่าตื่นเต้นให้ชาติของคุณ
 # Requires translation!
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = เมื่อคุณก่อตั้งเมืองหลวงแล้ว คุณจะถูกเตือนให้เลือกเทคโนโลยีเพื่อวิจัย
 # Requires translation!
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = เทคโนโลยีทุกอย่างมีต้นทุนเป็น ⍾วิทยาศาสตร์ ทุกเทิร์น ⍾วิทยาศาสตร์ที่ชาติผลิตได้จะถูกจ่ายเข้าการวิจัยเทคโนโลยีที่คุณเลือก
 # Requires translation!
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = เมื่อเทคโนโลยีได้รับการจ่ายต้นทุนครบ คุณก็ปลดล็อกประโยชน์ให้ชาติ! อาจเป็นยูนิตใหม่ สิ่งก่อสร้าง หรือข้อได้เปรียบอื่น ส่วนเกินจะล้นไปยังเทคโนโลยีถัดไปที่คุณเลือกวิจัย
 # Requires translation!
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = การวิจัยเทคโนโลยีในยุคถัดไปจะนำคุณเข้าสู่ยุคนั้นและส่งการแจ้งเตือนถึงชาติอื่นว่าคุณยอดเยี่ยมเพียงใด!
 # Requires translation!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = เนื่องจากเทคโนโลยีใหม่มักเปิดให้ใช้ยูนิต สิ่งก่อสร้างที่ดีกว่า และแม้แต่ปลดล็อกนโยบายทรงพลังใหม่ การนำหน้าคู่แข่งจึงเป็นหนึ่งในวิธีที่ดีที่สุดเพื่อรักษาชัยชนะของคุณ!

 # Requires translation!
Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = อา ทอง สื่อกลางแลกเปลี่ยนสากล ทุกคนรักทอง! เขาว่ากันว่าซื้อความสุขไม่ได้ แต่เรือดำน้ำนิวเคลียร์ก็เกือบดีเท่ากัน
 # Requires translation!
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = คุณหาทองเพิ่มได้จากช่อง ทรัพยากร สิ่งปรับปรุง และในที่สุดสิ่งก่อสร้าง นักเชี่ยวชาญ และเส้นทางการค้า ซากปรักหักพังโบราณ การพบเมืองรัฐใหม่ และการปล้นก็เป็นแหล่งทองที่ดี ระหว่างยุคทอง ทุกช่องที่ให้ทองอยู่แล้วจะให้ทองเพิ่มอีก 1!
 # Requires translation!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = ทองคือสิ่งที่คุณใช้จ่ายค่าบำรุงรักษาสิ่งก่อสร้าง ค่าขนส่ง และค่ายูนิต หากทองหมด ก่อนอื่นคุณจะถูกลงโทษการผลิต ⍾วิทยาศาสตร์ และในที่สุดยูนิตของคุณจะเริ่มถูกปลดประจำการเพราะจ่ายค่าบำรุงไม่ไหว
 # Requires translation!
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = ทองใช้ซื้อสิ่งก่อสร้างและยูนิต ช่วยตั้งเมืองใหม่หรือสร้างกองทัพอย่างรวดเร็ว ยังซื้อช่องเพิ่มเข้าเมืองได้ และใช้อัปเกรดยูนิตจากรูปแบบเก่าที่ล้าสมัยเป็นรุ่นใหม่ที่แข็งแกร่งกว่า และการลงทุนในข้อตกลงวิจัยร่วมเป็นวิธีที่ดีในการแปลงทองเป็น ⍾วิทยาศาสตร์
 # Requires translation!
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = ทองยังมีค่ามากในการทูต คุณมอบทองให้เมืองรัฐโดยตรงเพื่อให้ได้รับความนิยม ใช้มันถ่วงดุลข้อตกลงการค้ากับชาติอื่น หรือเรียกร้องจนหยดสุดท้ายหลังสงครามที่ชนะ เมื่อศัตรูขอสงบศึก
 # Requires translation!
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = น่าขันที่บางคนอาจมองว่าทองเป็นหนึ่งในทรัพยากรที่สำคัญน้อยกว่า แต่ลักษณะที่ยืดหยุ่นและความสำคัญต่อการดำเนินชาติของคุณทำให้มันเป็นสิ่งล้ำค่าที่ควรใส่ใจ อย่างไรก็ตาม ทุกคนรักทอง
 # Requires translation!
Not to be confused with the Resource of the same name, Gold Ore = อย่าสับสนกับทรัพยากรชื่อเดียวกัน แร่ทองคำ
 # Requires translation!
Trade Route = เส้นทางการค้า
 # Requires translation!
See also: [param] = ดูเพิ่มเติม: [param]
 # Requires translation!
Research Agreements = ข้อตกลงวิจัยร่วม

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness.
 # Requires translation!
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = นั่นหมายความว่าการขยายอย่างรวดเร็วใน Unciv ทำได้ยากมาก\nไม่ใช่เป็นไปไม่ได้ แต่ในฐานะผู้เล่นใหม่คุณคงไม่ควรทำ\nแล้วควรทำอะไร? ผ่อนคลาย สอดแนม และปรับปรุงผืนดินที่คุณมีด้วยการสร้างคนงาน\nสร้างเมืองใหม่เมื่อพบจุดที่คุณเชื่อว่าเหมาะสมแล้วเท่านั้น

 # Requires translation!
Unhappiness = ความไม่พอใจ
 # Requires translation!
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = ดูเหมือนประชาชนของคุณไม่มีความสุข!\nขณะที่ไม่มีความสุข อารยธรรมของคุณจะได้รับผลเสียมากมาย ซึ่งรุนแรงขึ้นเมื่อความไม่พอใจเพิ่มสูงขึ้น
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1
