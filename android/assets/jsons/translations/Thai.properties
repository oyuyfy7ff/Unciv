Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = พระเจ้าอเล็กซานเดอร์ผู้ยิ่งใหญ่ ผู้นำแห่งชาติกรีกอันเกรียงไกร ท่านได้รับพรจากทวยเทพอย่างแท้จริง ในปี 480 ก่อนคริสตกาล นครรัฐที่ชอบทะเลาะกันอย่างเอเธนส์ สปาร์ตา และธีบส์ หาทางรวมกำลังกันได้ ทำให้กรีกเอาชนะเปอร์เซียผู้ยิ่งใหญ่ได้ทั้งทางบกและทางทะเลในศตวรรษที่ 5 ก่อนคริสตกาล เจริญรอยตามพวกเขา ท่านนำพันธมิตรกรีกโค่นจักรวรรดิเปอร์เซียลงในที่สุดในปี 331 ก่อนคริสตกาล ท่านพิชิตเกือบทั้งโลกที่รู้จัก และสร้างจักรวรรดิที่ไม่มีใครเทียบได้ตั้งแต่ยุโรปถึงแอฟริกาและอินเดีย
