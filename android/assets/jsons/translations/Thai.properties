 # Requires translation!
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = โอ เตมูจินผู้ยิ่งใหญ่ ผู้นำอมตะแห่งจักรวรรดิมองโกลอันเกรียงไกร! เพียงพระนามของท่านก็ทำให้เมืองพังทลาย และเสียงกองทหารม้ามองโกลอันทรงพลังก็ทำให้ศัตรูหนีกระเจิง โอ ข่านผู้ยิ่งใหญ่! เมื่อเอเชียเหนือรวมเป็นชนชาติอันทรงพลัง ก่อกำเนิดหนึ่งในกองทัพที่ยิ่งใหญ่ที่สุดเท่าที่โลกเคยรู้จัก พลธนูม้าผู้ชำนาญของท่านพิชิตจีนเกือบทั้งหมด เอเชียตะวันออก และไปถึงประตูยุโรปทางตะวันตกในเวลาเพียงไม่กี่ปี ด้วยการทูตอันเจ้าเล่ห์และการสงครามอันเฉลียวฉลาด ท่านกวาดศัตรูทีละคน สร้างจักรวรรดิที่ยิ่งใหญ่ที่สุดเท่าที่เคยเห็น ทำให้การพิชิตของโรมันหรือกรีกเป็นเพียงความสำเร็จเล็กน้อย
 # Requires translation!
