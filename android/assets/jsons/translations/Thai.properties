Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = อัสเกีย ผู้นำชาวซองไฮและผู้ยิ่งใหญ่ที่สุดในบรรดาทั้งปวง ขอพระเจ้าทรงดูแลเส้นทางของท่านสู่ความรุ่งโรจน์! ซองไฮอยู่ใต้การปกครองของรัฐมาลีอันทรงพลังแห่งแอฟริกาตะวันตกจนถึงกลางศตวรรษที่ 14 พระเจ้าซุนนี อาลี เบอร์ผู้ยิ่งใหญ่ต่อสู้เพื่อเอกราช และแสดงอำนาจของซองไฮให้ทุกคนเห็นด้วยการพิชิตดินแดนและขับไล่ศัตรูมากมายที่พยายามทำลายอาณาจักรที่กำลังผงาด ในที่สุด การพิชิตเมืองมั่งคั่งอย่างทิมบักตูและเจนเนทำให้ซองไฮเป็นจักรวรรดิที่มีพลังเศรษฐกิจพอจะอยู่รอดได้หนึ่งศตวรรษ จนกระทั่งจักรวรรดิพ่ายต่อศัตรูที่มีเทคโนโลยีก้าวหน้า คือปืนคาบศิลาต่อสู้กับนักรบหอก
