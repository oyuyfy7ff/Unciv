Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = ดาริอัสผู้ยิ่งใหญ่แห่งเปอร์เซีย สวรรค์ส่องแสงลงมาที่ท่าน! ชาวเปอร์เซียแข็งแกร่งและฉลาดเฉกเช่นผู้นำของพวกเขา ในยุคโบราณ กษัตริย์ไซรัสผู้ยิ่งใหญ่แห่งเปอร์เซียต่อสู้กับจักรวรรดิมีเดียอันทรงพลังและทำลายชาวมีดีสได้ในที่สุดในปี 550 ก่อนคริสตกาล การทูตอันเจ้าเล่ห์และความสำเร็จทางทหารช่วยให้พิชิตลิเดียอันมั่งคั่งและบาบิโลนอันทรงอำนาจ และโอรสของไซรัสพิชิตอียิปต์อันเป็นนิรันดร์ในอีกไม่กี่ปีต่อมา ณ จุดสูงสุดของอำนาจ จักรวรรดิเปอร์เซียไปถึงชายฝั่งมาซิโดเนีย ที่หน้าประตูของนครรัฐกรีกที่เพิ่งผงาด เปอร์เซียคงรุ่งเรืองต่อไปหลายศตวรรษหากอเล็กซานเดอร์แห่งมาซิโดเนียไม่ทำลายจักรวรรดิอันยิ่งใหญ่ลงอย่างโหดเหี้ยมด้วยการโจมตีอันรุนแรงเพียงครั้งเดียว
