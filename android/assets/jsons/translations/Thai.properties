O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = โอ มอนเตซูมาผู้ศักดิ์สิทธิ์ ประชาชนของท่านขอต้อนรับท่าน! ขอให้ความงดงามของท่านดลใจสรรพสิ่งที่มีชีวิต! ชาวแอซเท็กอันเกรียงไกรเป็นพวกเร่ร่อนจนถึงศตวรรษที่ 12 เมื่อพวกเขาเลือกตั้งถิ่นฐานบนที่ราบสูงตอนกลาง ซึ่งต่อมาเรียกว่าเม็กซิโก สงครามกับเผ่าอื่นเกิดขึ้นบ่อยเพื่อควบคุมผืนแผ่นดินอุดมสมบูรณ์รอบทะเลสาบศักดิ์สิทธิ์เท็กซ์โคโก ซัลโตกัน และซัมปันโก ภายในราว 200 ปี พันธมิตรสองหน้าและความเชี่ยวชาญด้านการสงครามทำให้ชาวแอซเท็กเป็นมหาอำนาจเหนือแอ่งอเมริกากลาง ก่อตั้งจักรวรรดิอันทรงพลังที่แผ่จากทะเลถึงทะเล อนิจจา จักรวรรดิล่มสลายภายใต้การโจมตีของปีศาจต่างแดน คือชาวสเปนและคำสาปมากมายที่พวกเขานำมา! สงครามระหว่างเผ่าและอาวุธมหาประลัยที่ผู้รุกรานใช้ทำให้อารยธรรมแอซเท็กอันยิ่งใหญ่พังทลายในเวลาเพียงไม่กี่ทศวรรษ
