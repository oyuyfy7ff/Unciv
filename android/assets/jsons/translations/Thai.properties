All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = ขอถวายพระพรพระเจ้ากุสตาฟ อดอล์ฟผู้ยิ่งใหญ่ ผู้ก่อตั้งจักรวรรดิสวีเดนและหนึ่งในนักยุทธวิธีทางทหารที่มีชื่อเสียงที่สุด ในต้นศตวรรษที่ 17 สวีเดนผงาดเป็นมหาอำนาจในยุโรปภายใต้การครองราชย์ของพระองค์ ด้วยพระปรีชาทั้งทางการทูตและการสงคราม ในฐานะกษัตริย์ พระองค์ตัดสินใจปฏิรูปกฎหมายสวีเดนเพื่อนำเสถียรภาพทางเศรษฐกิจและความเจริญรุ่งเรืองมาสู่ประชาชน พันธมิตรและศัตรูเรียกพระองค์ว่า 'สิงโตแห่งทิศเหนือ' ได้เห็นวิสัยทัศน์ทางการสงครามสมัยใหม่และความเก่งกาจของกองทัพของพระองค์บนสนามรบ เมื่อพระองค์ได้ชัยในสงครามสามสิบปี พระนามจะถูกจดจำตลอดไปในฐานะหนึ่งในแม่ทัพที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์
