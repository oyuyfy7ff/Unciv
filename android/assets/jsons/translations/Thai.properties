Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = ขอคารวะราชินีไดโดผู้ทรงเกียรติ ผู้ปกครองอาณาจักรคาร์เธจในตำนาน กวีเอกเวอร์จิลเล่าประวัติศาสตร์อันยิ่งใหญ่ของท่าน ว่าสามีของท่านอาเซอร์บาสถูกฆ่าโดยพระอนุชาของท่านเอง กษัตริย์พิกมาเลียนแห่งไทร์ เพื่อขโมยสมบัติของครอบครัวที่เป็นของท่านโดยชอบธรรม แต่ท่านอดทนต่อแรงกดดันของเขาจนท่านและเพื่อนร่วมชาติตัดสินใจหนีและแล่นเรือไปยังแผ่นดินใหม่ ทวยเทพนำท่านสู่ชายฝั่งแอฟริกาเหนือ และด้วยการทูตอันเจ้าเล่ห์ ท่านขยายดินแดนบ้านใหม่และวางรากฐานของอาณาจักรคาร์เธจในอนาคต
