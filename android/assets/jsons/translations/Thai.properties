Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = จักรพรรดินีธีโอโดราผู้ยิ่งใหญ่ ที่รักของไบแซนเทียมและโรม ประชาชนของท่านขอคารวะ! ด้วยความงามและสติปัญญา ท่านก้าวขึ้นจากนักแสดงและหญิงบริการสู่ตำแหน่งสตรีที่ทรงอำนาจที่สุดในจักรวรรดิโรมัน ในฐานะพระมเหสีของจัสติเนียนที่ 1 ในปลายทศวรรษ 520 ท่านช่วยพระสวามีปฏิรูปทางจิตวิญญาณและกฎหมาย ประกาศกฎหมายมากมายเพื่อยกระดับสถานะและการปฏิบัติต่อสตรีในจักรวรรดิ ท่านยังทำให้คอนสแตนติโนเปิลเป็นอัญมณีของจักรวรรดิโรมันตะวันออกด้วยการบูรณะและสร้างท่อส่งน้ำ สะพาน และโบสถ์มากมาย ความงามของเมืองถึงขีดสุดด้วยการสร้างฮาเกียโซเฟีย หนึ่งในสถาปัตยกรรมที่งดงามที่สุดในโลก
