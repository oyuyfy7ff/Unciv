 # Requires translation!
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = โอ พ่อขุนรามคำแหงผู้ยิ่งใหญ่ ชาวสยามเชื่อฟังท่านด้วยความเคารพและเกรงกลัว! แผ่นดินสยามอันงดงามและลึกลับเป็นประเทศโบราณใจกลางเอเชียตะวันออกเฉียงใต้ ซึ่งถูกศัตรูมากมายล้อมโจมตี ถูกสงครามนองเลือดและความยากจนข้นแค้นรุมเร้า แต่ในที่สุดชาวสยามผู้ฉลาดและซื่อสัตย์ก็อดทนและได้รับชัยชนะ สยามเคยเป็นส่วนหนึ่งของจักรวรรดิขแมร์จนถึงศตวรรษที่ 13 ก่อนที่ประชาชนผู้กล้าหาญจะจับอาวุธและนำการปฏิวัติก่อตั้งอาณาจักรสุโขทัยเล็ก ๆ หลังการรบและความสามารถทางการทูตมากมาย อาณาจักรเล็กนี้กลายเป็นจักรวรรดิอันทรงพลังที่ครองเอเชียตะวันออกเฉียงใต้นานกว่าหนึ่งศตวรรษ
