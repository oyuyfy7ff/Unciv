 # Requires translation!
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = ขอคารวะเจ้าชายวิลเลียมแห่งออเรนจ์ผู้ทรงปัญญาและกล้าหาญ ผู้ปลดปล่อยเนเธอร์แลนด์และมอบพลังแก่ชาวดัตช์ ในปี 1568 ท่านนำการกบฏต่อการปกครองของสเปนเพื่อเสรีภาพของประชาชน และจึงเริ่มสงครามแปดสิบปี การกระทำของท่านล้วนมุ่งสร้างหนึ่งในสาธารณรัฐสมัยใหม่แห่งแรกของยุโรป คือสหจังหวัดทั้งเจ็ด การกบฏคือความหมายของชีวิตและความตายของท่าน และยังเป็นสาเหตุที่ท่านถูกลอบสังหารในปี 1584 แต่ความตายของท่านมอบความภาคภูมิและความกล้าหาญแก่ประชาชนยิ่งขึ้นเพื่อต่อสู้เพื่อเสรีภาพต่อผู้กดขี่ทุกคน จารึกในประวัติศาสตร์ว่า 'บิดาแห่งปิตุภูมิ' ชื่อของท่านเป็นสัญลักษณ์แห่งเอกราชของชาวดัตช์ตลอดนิรันดร์
