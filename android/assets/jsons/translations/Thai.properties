Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = ขอต้อนรับ ไฮอาวาธาผู้สูงศักดิ์ ผู้นำแห่งชาติอิโรควอยส์อันเกรียงไกร! ประชาชนของท่านอาศัยอยู่ใกล้ทะเลสาบออนแทรีโออันศักดิ์สิทธิ์ยิ่งใหญ่มาตั้งแต่ยุคโบราณ บนผืนดินที่ต่อมารู้จักกันในชื่อนครนิวยอร์ก นานมาแล้ว ห้าชนเผ่าคือเซเนกา โอนันดากา โมฮอว์ก คายูกา และโอไนดา รวมเป็นหนึ่งชาติ คือเฮาเดโนซอนี หรืออิโรควอยส์ แม้ไม่มีภาษาเขียน ชาวอิโรควอยส์ผู้ทรงปัญญาก็สร้างกฎหมายสันติภาพอันยิ่งใหญ่ ซึ่งถือได้ว่าเป็นรัฐธรรมนูญฉบับแรก เป็นเวลาหลายสิบปี ประชาชนของท่านสู้กับศัตรูที่แข็งแกร่ง เช่น ฮูรอน แล้วก็อาณานิคมฝรั่งเศสและอังกฤษ แม้มีนักรบน้อยกว่าและอาวุธด้อยกว่า ชาวอิโรควอยส์ก็ยังคงอยู่รอดและเดินบนเส้นทางแห่งสันติและความสามัคคี จนกระทั่งวิถีชีวิตของพวกเขาเลือนหายภายใต้การบดขยี้ของชาติสหรัฐอเมริกาที่เพิ่งกำเนิด
