May the gods bless you, great Nebuchadnezzar, ruler of ancient Babylon! Built 5000 years ago, Babylon emerged as an empire in 1800 BC, thanks to godlike Hammurabi, The Giver of Law. Falling under the Kassites assaults then the Assyrian domination, Babylon was reborn from its ashes, gaining back its independance, and became the beacon for Arts and Learning in the ancient world. O Nebuchadnezzar, after your death, Babylon quickly fell, conquered by the mighty Persians, and then by the Greeks, until the great city disappeared forever in 141 BC. = ขอเทพเจ้าอวยพรท่าน เนบูคัดเนสซาร์ผู้ยิ่งใหญ่ ผู้ปกครองบาบิโลนโบราณ! บาบิโลนสร้างขึ้นเมื่อ 5,000 ปีก่อน และก้าวขึ้นเป็นจักรวรรดิในปี 1800 ก่อนคริสตกาล ด้วยพระปรีชาของฮัมมูราบีผู้ทรงมอบกฎหมาย หลังตกอยู่ใต้การโจมตีของชาวแคสไซต์และการครอบงำของอัสซีเรีย บาบิโลนก็ฟื้นคืนชีพจากเถ้าถ่าน ได้เอกราชกลับมา และกลายเป็นประภาคารแห่งศิลปะและความรู้ในโลกโบราณ โอ เนบูคัดเนสซาร์ หลังจากท่านสิ้นพระชนม์ บาบิโลนก็ล่มสลายอย่างรวดเร็ว ถูกชาวเปอร์เซียผู้ยิ่งใหญ่พิชิต ต่อมาก็ถูกชาวกรีก จนกระทั่งมหานครแห่งนี้สูญหายไปตลอดกาลในปี 141 ก่อนคริสตกาล
